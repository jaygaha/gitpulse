<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <!-- Git Amber to Warning Orange Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="50%" stop-color="#ff8c42" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle background grid lines for tech theme -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <path d="M 0,150 L 800,150 M 0,300 L 800,300 M 0,450 L 800,450" />
    <path d="M 200,0 L 200,600 M 400,0 L 400,600 M 600,0 L 600,600" />
  </g>

  <!-- Combined Logo Group -->
  <g transform="translate(100, 50)" filter="url(#glow)">

    <!-- Main Connection Paths (Git + Pulse Line) -->
    <!-- Path begins as a git straight trunk, splits into a branch, merges back into a sharp ECG pulse, and finishes flat -->
    <path d="M 50,250
             L 150,250
             C 180,250 200,200 230,200
             L 330,200
             C 360,200 380,250 410,250
             L 440,250
             L 455,130
             L 475,370
             L 495,210
             L 510,270
             L 525,250
             L 600,250"
          fill="none"
          stroke="url(#logoGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Git Lower Trunk Path -->
    <path d="M 150,250 L 150,350 L 300,350"
          fill="none"
          stroke="#f5a623"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Git Nodes (Circles) -->
    <!-- Root Node -->
    <circle cx="150" cy="250" r="14" fill="#0a0a0f" stroke="#f5a623" stroke-width="8" />

    <!-- Upper Branch Node -->
    <circle cx="230" cy="200" r="10" fill="#f5a623" />

    <!-- Lower Branch Node -->
    <circle cx="150" cy="350" r="14" fill="#0a0a0f" stroke="#f5a623" stroke-width="8" />
    <circle cx="250" cy="350" r="10" fill="#f5a623" />

    <!-- Pulse Integration Node (Where Git meets Pulse) -->
    <circle cx="410" cy="250" r="12" fill="#0a0a0f" stroke="#ff8c42" stroke-width="6" />

    <!-- End Pulse Glow Node -->
    <circle cx="600" cy="250" r="10" fill="#ef4444" />
  </g>

  <!-- Typography -->
  <text x="400" y="520" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="42" fill="#ffffff" letter-spacing="4">
    GIT<tspan fill="#f5a623">PULSE</tspan>
  </text>

  <text x="400" y="555" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="16" fill="#6e6e7a" letter-spacing="2">
    VERSION CONTROL HEARTBEAT
  </text>
</svg>
